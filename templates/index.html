<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novel Translator</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:wght@300;400;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F8F5;--surface:#EAF3EE;--surface2:#DFF0E6;--jade:#4A9E7E;--jade-lt:#6CBEAA;--jade-dk:#357A5E;--jade-bg2:#4A9E7E15;--text:#1C3830;--text2:#4A6E5F;--text3:#8BB0A0;--rule:#CBE0D4;--rule2:#BCD5C8;--red:#C27050;--r-bg:#F2F8F5;--r-text:#1C3830;--r-font:'Lora',serif;--r-size:19px;--r-lh:2.05}
*{margin:0;padding:0;box-sizing:border-box}html{font-size:16px;-webkit-font-smoothing:antialiased}body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}
.screen{display:none;min-height:100vh;flex-direction:column}.screen.active{display:flex}
#landing{align-items:center;justify-content:center;padding:40px 24px;position:relative}
.l-logo{width:118px;height:118px;border-radius:50%;object-fit:cover;border:2px solid var(--rule);box-shadow:0 4px 28px rgba(74,158,126,0.12);margin-bottom:22px}
.l-title{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:400;color:var(--text);margin-bottom:6px}
.l-sub{font-size:11px;letter-spacing:3.5px;text-transform:uppercase;color:var(--text3);margin-bottom:38px}
.l-input-row{display:flex;gap:10px;width:100%;max-width:540px}
.l-input{flex:1;padding:14px 18px;background:#fff;border:1.5px solid var(--rule);border-radius:14px;font-size:14px;font-family:inherit;color:var(--text);outline:none;transition:all .3s}.l-input:focus{border-color:var(--jade-lt)}.l-input::placeholder{color:var(--text3)}
.l-btn{padding:0 26px;background:var(--jade);color:#fff;border:none;border-radius:14px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .25s;white-space:nowrap;box-shadow:0 2px 14px rgba(74,158,126,0.25)}.l-btn:hover{background:var(--jade-dk)}.l-btn:disabled{opacity:.4;cursor:default}
.l-styles{margin-top:18px;width:100%;max-width:540px}
.l-styles-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:8px;text-align:center}
.l-styles-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.style-chip{padding:7px 16px;background:#fff;border:1.5px solid var(--rule);border-radius:22px;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .2s}.style-chip:hover{border-color:var(--jade-lt)}.style-chip.active{border-color:var(--jade);color:var(--jade-dk);background:var(--jade-bg2);font-weight:500}
.l-status{margin-top:16px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.l-history{margin-top:30px;width:100%;max-width:540px}.l-history-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.l-hist-item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#fff;border:1px solid var(--rule);border-radius:12px;margin-bottom:5px;cursor:pointer;transition:all .2s}.l-hist-item:hover{border-color:var(--jade-lt)}
.l-hist-dot{width:5px;height:5px;border-radius:50%;background:var(--jade-lt);flex-shrink:0}.l-hist-text{flex:1;overflow:hidden}.l-hist-url{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.l-hist-ch{font-size:10px;color:var(--text3);margin-top:1px}
.l-hist-del{background:none;border:none;color:var(--text3);font-size:13px;cursor:pointer;padding:4px;opacity:.4}.l-hist-del:hover{opacity:1;color:var(--red)}
#novelInfo{align-items:center;padding:40px 24px 60px}
.ni-card{width:100%;max-width:640px;background:#fff;border-radius:20px;padding:32px 28px;box-shadow:0 2px 24px rgba(74,158,126,0.06);border:1px solid var(--rule)}
.ni-back{background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;font-family:inherit;margin-bottom:16px;padding:0}.ni-back:hover{color:var(--jade)}
.ni-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500;color:var(--text);margin-bottom:4px;line-height:1.3}
.ni-title-vi{font-size:14px;color:var(--jade-dk);margin-bottom:12px;font-style:italic;font-family:'Cormorant Garamond',serif}
.ni-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.ni-stat{padding:5px 12px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;font-size:11px;color:var(--text2)}.ni-stat b{font-weight:500;color:var(--text)}
.ni-mem{padding:8px 14px;background:var(--jade-bg2);border:1px solid var(--jade-lt);border-radius:10px;font-size:11px;color:var(--jade-dk);display:none;margin-bottom:16px}.ni-mem.on{display:block}
.ni-start{width:100%;padding:14px;background:var(--jade);color:#fff;border:none;border-radius:14px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;box-shadow:0 2px 14px rgba(74,158,126,0.25)}.ni-start:hover{background:var(--jade-dk)}
.ni-divider{height:1px;background:var(--rule);margin:18px 0}
.ni-ch-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ni-ch-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3)}
.ni-ch-list{max-height:55vh;overflow-y:auto}.ni-ch{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2)}.ni-ch:hover{background:var(--surface)}.ni-ch-num{font-size:11px;color:var(--text3);width:32px;text-align:right;flex-shrink:0}
.topbar{padding:10px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;background:#fff;position:sticky;top:0;z-index:50}
.tb-logo{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid var(--rule);cursor:pointer}.tb-title{flex:1;font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-btn{background:none;border:1px solid var(--rule);border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:15px}.tb-btn:hover{border-color:var(--jade-lt);color:var(--jade)}
.mem-badge{display:none;padding:2px 8px;background:var(--jade-bg2);border:1px solid var(--jade-lt);border-radius:16px;font-size:9px;color:var(--jade-dk);white-space:nowrap}.mem-badge.on{display:inline-flex;align-items:center;gap:3px}
.ch-panel{border-bottom:1px solid var(--rule);display:none}.ch-panel.open{display:block}
.ch-head{padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--rule);font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase}
.ch-list{max-height:45vh;overflow-y:auto;background:#fff}.ch-item{padding:10px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid var(--rule)}.ch-item:hover{background:var(--surface)}.ch-item.active{background:var(--surface2);border-left:3px solid var(--jade);padding-left:13px}
.ch-num{font-size:11px;color:var(--text3);width:26px;text-align:right;flex-shrink:0}.ch-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:var(--rule2)}.ch-dot.done{background:var(--jade)}.ch-dot.busy{background:var(--jade);animation:pulse 1s infinite}
.ch-title{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.ch-ok{font-size:9px;color:var(--jade);flex-shrink:0}
.settings-drawer{border-bottom:1px solid var(--rule);background:var(--surface);display:none;padding:16px}.settings-drawer.open{display:block}
.s-section{margin-bottom:14px}.s-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}.s-row{display:flex;gap:5px;flex-wrap:wrap}
.s-chip{padding:5px 12px;background:#fff;border:1px solid var(--rule);border-radius:20px;font-size:11px;color:var(--text2);cursor:pointer;font-family:inherit}.s-chip:hover{border-color:var(--jade-lt)}.s-chip.active{border-color:var(--jade);color:var(--jade-dk);background:var(--jade-bg2)}
.s-color{width:28px;height:28px;border-radius:50%;border:2px solid var(--rule);cursor:pointer}.s-color:hover,.s-color.active{border-color:var(--jade)}
.s-slider-row{display:flex;align-items:center;gap:10px}.s-slider{flex:1;-webkit-appearance:none;height:3px;background:var(--rule2);border-radius:2px;outline:none}.s-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--jade);cursor:pointer;border:none}.s-val{font-size:11px;color:var(--text2);width:28px;text-align:right}
.s-textarea{width:100%;padding:8px 12px;background:#fff;border:1px solid var(--rule);border-radius:8px;font-size:11px;color:var(--text);outline:none;resize:vertical;min-height:50px;line-height:1.6;font-family:inherit}.s-textarea:focus{border-color:var(--jade-lt)}.s-textarea::placeholder{color:var(--text3)}
.s-foot{font-size:9px;color:var(--text3);margin-top:4px;display:flex;justify-content:space-between}.s-link{background:none;border:none;color:var(--jade);font-size:9px;cursor:pointer;font-family:inherit;opacity:.7}.s-link:hover{opacity:1}
.ch-nav{padding:8px 16px;border-bottom:1px solid var(--rule);display:none;justify-content:space-between;align-items:center;background:#fff}.ch-nav.open{display:flex}
.nav-btn{padding:7px 16px;background:#fff;border:1px solid var(--rule);border-radius:9px;font-size:11px;color:var(--text2);cursor:pointer;font-family:inherit}.nav-btn:hover:not(:disabled){border-color:var(--jade-lt);color:var(--jade)}.nav-btn:disabled{color:var(--text3);opacity:.3;cursor:default}
.nav-title{font-size:14px;color:var(--jade-dk);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%;text-align:center;font-family:'Cormorant Garamond',serif}
.status-bar{padding:10px 16px;border-bottom:1px solid var(--rule);display:none;align-items:center;gap:8px;background:var(--surface)}.status-bar.on{display:flex}
.spinner{width:13px;height:13px;border:1.5px solid var(--rule2);border-top-color:var(--jade);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
.status-text{font-size:12px;color:var(--text2)}
.error-bar{padding:10px 16px;border-bottom:1px solid #E0C0B8;background:#FDF5F2;font-size:12px;color:var(--red);display:none}.error-bar.on{display:block}
.reader-area{flex:1;padding:44px 20px 100px;background:var(--r-bg);transition:background .3s}
.reader-body{max-width:660px;margin:0 auto;font-family:var(--r-font);font-size:var(--r-size);line-height:var(--r-lh);color:var(--r-text);font-weight:400}
.reader-body p{margin-bottom:.85em;text-indent:2em}
.next-btn{display:block;margin:44px auto 0;padding:12px 32px;background:transparent;border:1px solid var(--rule);border-radius:11px;font-size:12px;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif}.next-btn:hover{border-color:var(--jade);color:var(--jade)}
.reader-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:35vh;color:var(--text3);font-size:13px;gap:8px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--rule2);border-radius:2px}
@media(min-width:768px){.topbar,.ch-head,.ch-nav,.status-bar,.error-bar,.settings-drawer{padding-left:32px;padding-right:32px}.ch-item{padding-left:32px;padding-right:32px}.ch-item.active{padding-left:29px}.reader-area{padding:56px 40px 120px}}
</style>
</head>
<body>
<div id="landing" class="screen active">
  <img src="/static/logo.jpg" class="l-logo" alt="">
  <div class="l-title">Novel Translator</div>
  <div class="l-sub">Trung → Việt · Gemini AI</div>
  <div class="l-input-row">
    <input class="l-input" id="landingUrl" placeholder="Dán URL truyện..." onkeydown="if(event.key==='Enter')loadNovel()">
    <button class="l-btn" id="landingBtn" onclick="loadNovel()">Đọc</button>
  </div>
  <div class="l-styles"><div class="l-styles-label">Phong cách dịch</div><div class="l-styles-row">
    <button class="style-chip active" data-style="nguyenban" onclick="pickStyle(this)">Nguyên bản</button>
    <button class="style-chip" data-style="cotrang" onclick="pickStyle(this)">Cổ trang</button>
    <button class="style-chip" data-style="hiendai" onclick="pickStyle(this)">Hiện đại</button>
    <button class="style-chip" data-style="langman" onclick="pickStyle(this)">Lãng mạn</button>
    <button class="style-chip" data-style="satnghia" onclick="pickStyle(this)">Sát nghĩa</button>
  </div></div>
  <div class="l-status" id="landingStatus" style="display:none"><div class="spinner" id="landingSpinner"></div><span id="landingStatusText"></span></div>
  <div class="l-history" id="historySection" style="display:none"><div class="l-history-title">Đọc gần đây</div><div id="historyList"></div></div>
</div>

<div id="novelInfo" class="screen">
  <div class="ni-card">
    <button class="ni-back" onclick="goLanding()">← Quay lại</button>
    <div class="ni-title" id="niTitle">—</div>
    <div class="ni-title-vi" id="niTitleVi"></div>
    <div class="ni-stats" id="niStats"></div>
    <div class="ni-mem" id="niMem"></div>
    <button class="ni-start" id="niStartBtn" onclick="enterReader()">Bắt đầu đọc</button>
    <div class="ni-divider"></div>
    <div class="ni-ch-header"><span class="ni-ch-title">Danh sách chương · <span id="niChCount"></span></span></div>
    <div class="ni-ch-list" id="niChList"></div>
  </div>
</div>

<div id="readerScreen" class="screen">
  <div class="topbar">
    <img src="/static/logo.jpg" class="tb-logo" onclick="goNovelInfo()" title="Thông tin truyện">
    <span class="tb-title" id="tbTitle">—</span>
    <span class="mem-badge" id="memBadge">⚡ Memory</span>
    <button class="tb-btn" onclick="togglePanel('chPanel')" title="Mục lục">☰</button>
    <button class="tb-btn" onclick="togglePanel('settingsDrawer')" title="Cài đặt">⚙</button>
  </div>
  <div class="ch-panel" id="chPanel"><div class="ch-head"><span id="chCount"></span></div><div class="ch-list" id="chList"></div></div>
  <div class="settings-drawer" id="settingsDrawer">
    <div class="s-section"><div class="s-label">Phông chữ</div><div class="s-row" id="fontPicker">
      <button class="s-chip active" data-font="'Lora',serif" onclick="setFont(this)">Lora</button>
      <button class="s-chip" data-font="'EB Garamond',serif" onclick="setFont(this)">Garamond</button>
      <button class="s-chip" data-font="'Noto Serif',serif" onclick="setFont(this)">Noto Serif</button>
      <button class="s-chip" data-font="'Source Serif 4',serif" onclick="setFont(this)">Source Serif</button>
      <button class="s-chip" data-font="'DM Sans',sans-serif" onclick="setFont(this)">DM Sans</button>
    </div></div>
    <div class="s-section"><div class="s-label">Cỡ chữ</div><div class="s-slider-row"><input type="range" class="s-slider" id="sizeSlider" min="14" max="28" value="19" oninput="setSize(this.value)"><span class="s-val" id="sizeVal">19</span></div></div>
    <div class="s-section"><div class="s-label">Dãn dòng</div><div class="s-slider-row"><input type="range" class="s-slider" id="lhSlider" min="150" max="300" value="205" step="5" oninput="setLh(this.value)"><span class="s-val" id="lhVal">2.05</span></div></div>
    <div class="s-section"><div class="s-label">Nền đọc</div><div class="s-row" style="gap:8px">
      <button class="s-color active" style="background:#F2F8F5" data-bg="#F2F8F5" data-text="#1C3830" onclick="setTheme(this)"></button>
      <button class="s-color" style="background:#FFFBF5" data-bg="#FFFBF5" data-text="#3D2E20" onclick="setTheme(this)"></button>
      <button class="s-color" style="background:#F5EDD6" data-bg="#F5EDD6" data-text="#3A3020" onclick="setTheme(this)"></button>
      <button class="s-color" style="background:#1A2A22" data-bg="#1A2A22" data-text="#C8DDD0" onclick="setTheme(this)"></button>
      <button class="s-color" style="background:#0C0C0C" data-bg="#0C0C0C" data-text="#D8D8D0" onclick="setTheme(this)"></button>
    </div></div>
    <div class="s-section"><div class="s-label">Prompt tuỳ chỉnh</div><textarea class="s-textarea" id="customPrompt" placeholder="Để trống = phong cách đã chọn"></textarea></div>
    <div class="s-section"><div class="s-label">Thuật ngữ thủ công</div><textarea class="s-textarea" id="glossary" placeholder="萧炎 = Tiêu Viêm&#10;斗气 = Đấu Khí"></textarea><div class="s-foot"><span>Kết hợp Memory</span><button class="s-link" onclick="clearCache()">Xóa cache dịch</button></div></div>
  </div>
  <div class="ch-nav" id="chNav"><button class="nav-btn" id="prevBtn" onclick="nav(-1)">← Trước</button><span class="nav-title" id="navTitle"></span><button class="nav-btn" id="nextBtn" onclick="nav(1)">Sau →</button></div>
  <div class="status-bar" id="statusBar"><div class="spinner"></div><span class="status-text" id="statusText"></span></div>
  <div class="error-bar" id="errorBar"></div>
  <div class="reader-area" id="readerArea"><div class="reader-body" id="readerBody"><div class="reader-empty">Chọn một chương để bắt đầu</div></div></div>
</div>

<script>
let chapters=[],currentIdx=-1,translated={},novelUrl='',novelTitle='',selectedStyle='nguyenban',resumeChapter=-1;
const $=id=>document.getElementById(id), LS=window.localStorage;
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function pickStyle(el){document.querySelectorAll('.style-chip').forEach(c=>c.classList.remove('active'));document.querySelectorAll(`.style-chip[data-style="${el.dataset.style}"]`).forEach(c=>c.classList.add('active'));selectedStyle=el.dataset.style;saveSettings()}
function saveProgress(){if(!novelUrl)return;const h=getHistory();const x=h.findIndex(a=>a.url===novelUrl);const e={url:novelUrl,chapter:currentIdx,title:chapters[currentIdx]?.title||'',novelTitle,time:Date.now()};if(x>=0)h[x]=e;else h.unshift(e);LS.setItem('nh',JSON.stringify(h.slice(0,10)))}
function getHistory(){try{return JSON.parse(LS.getItem('nh')||'[]')}catch{return[]}}
function saveSettings(){LS.setItem('ns',JSON.stringify({font:getComputedStyle(document.documentElement).getPropertyValue('--r-font').trim(),size:$('sizeSlider').value,lh:$('lhSlider').value,bg:getComputedStyle(document.documentElement).getPropertyValue('--r-bg').trim(),tx:getComputedStyle(document.documentElement).getPropertyValue('--r-text').trim(),g:$('glossary').value,p:$('customPrompt').value,s:selectedStyle}))}
function loadSettings(){try{const s=JSON.parse(LS.getItem('ns'));if(!s)return;if(s.font){document.documentElement.style.setProperty('--r-font',s.font);document.querySelectorAll('#fontPicker .s-chip').forEach(c=>c.classList.toggle('active',c.dataset.font===s.font))}if(s.size){$('sizeSlider').value=s.size;setSize(s.size)}if(s.lh){$('lhSlider').value=s.lh;setLh(s.lh)}if(s.bg){document.documentElement.style.setProperty('--r-bg',s.bg);document.documentElement.style.setProperty('--r-text',s.tx);document.querySelectorAll('.s-color').forEach(c=>c.classList.toggle('active',c.dataset.bg===s.bg))}if(s.g)$('glossary').value=s.g;if(s.p)$('customPrompt').value=s.p;if(s.s){selectedStyle=s.s;document.querySelectorAll('.style-chip').forEach(c=>c.classList.toggle('active',c.dataset.style===selectedStyle))}}catch{}}
function renderHistory(){const h=getHistory();if(!h.length){$('historySection').style.display='none';return}$('historySection').style.display='block';$('historyList').innerHTML=h.map((x,i)=>`<div class="l-hist-item" onclick="resumeNovel(${i})"><span class="l-hist-dot"></span><div class="l-hist-text"><div class="l-hist-url">${x.novelTitle||x.url}</div><div class="l-hist-ch">${x.title?'Ch.'+(x.chapter+1)+': '+x.title:'Ch.'+(x.chapter+1)}</div></div><button class="l-hist-del" onclick="event.stopPropagation();delHist(${i})">✕</button></div>`).join('')}
function delHist(i){const h=getHistory();h.splice(i,1);LS.setItem('nh',JSON.stringify(h));renderHistory()}
async function resumeNovel(i){const h=getHistory()[i];if(!h)return;$('landingUrl').value=h.url;resumeChapter=h.chapter;await loadNovel()}

/* ══════ CRITICAL FIX: loadNovel error handling ══════ */
async function loadNovel(){
  const url=$('landingUrl').value.trim();
  if(!url) return;
  novelUrl=url;
  $('landingBtn').disabled=true;
  $('landingStatus').style.display='flex';
  $('landingSpinner').style.display='block';
  $('landingStatusText').textContent='Đang tải mục lục...';

  try {
    const r=await fetch('/api/chapters',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Lỗi không xác định');
    chapters=d.chapters; translated={}; novelUrl=d.novel_url||url;
    novelTitle=d.novel_title||url.replace(/https?:\/\/(www\.)?/,'').split('/').slice(0,2).join('/');
    $('niTitle').textContent=novelTitle; $('niTitleVi').textContent='';
    $('niStats').innerHTML=`<div class="ni-stat"><b>${chapters.length}</b> chương</div><div class="ni-stat">${d.mode==='all_html'?'⚡ Toàn bộ':'📖 Từng chương'}</div>`;
    $('niChCount').textContent=chapters.length;
    $('niChList').innerHTML=chapters.map((c,i)=>`<div class="ni-ch" onclick="resumeChapter=${i};enterReader()"><span class="ni-ch-num">${i+1}</span><span>${c.title}</span></div>`).join('');
    if(resumeChapter>=0)$('niStartBtn').textContent=`Tiếp tục (Ch.${resumeChapter+1})`;
    else $('niStartBtn').textContent='Bắt đầu đọc';
    $('landingStatus').style.display='none';
    showScreen('novelInfo');
    initMemory();
  } catch(e) {
    /* FIXED: show error for 8 seconds, don't hide immediately */
    $('landingSpinner').style.display='none';
    $('landingStatusText').textContent='❌ '+e.message;
    setTimeout(()=>{ $('landingStatus').style.display='none'; $('landingSpinner').style.display='block'; }, 8000);
  }
  /* FIXED: only re-enable button, do NOT hide status here */
  $('landingBtn').disabled=false;
}

async function initMemory(){
  const n=$('niMem'); n.textContent='⏳ Khởi tạo Memory...'; n.classList.add('on');
  try{
    const b={novel_url:novelUrl}; if(chapters.length)b.first_chapter_url=chapters[0].url;
    const r=await fetch('/api/init_memory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
    const d=await r.json();
    if(d.memory){const m=d.memory; n.textContent=`⚡ Memory: ${m.characters} nhân vật · ${m.places} địa danh · ${m.terms} thuật ngữ`;
      if(m.novel_title_vi)$('niTitleVi').textContent=m.novel_title_vi;
      if(m.genre)$('niStats').innerHTML+=`<div class="ni-stat">${m.genre}</div>`;
      updateMemBadge(m);}
  }catch{n.textContent='Memory: chưa sẵn sàng'}
}
function updateMemBadge(m){const b=$('memBadge');if(m&&(m.characters>0||m.terms>0)){b.textContent=`⚡${m.characters}NV·${m.terms}TN`;b.classList.add('on')}else b.classList.remove('on')}

function enterReader(){showScreen('readerScreen');$('chCount').textContent=chapters.length+' chương';$('tbTitle').textContent=novelTitle;renderCh();const i=resumeChapter>=0?resumeChapter:0;resumeChapter=-1;openCh(i)}
function showStatus(m){$('statusBar').classList.add('on');$('statusText').textContent=m}
function hideStatus(){$('statusBar').classList.remove('on')}
function showError(m){$('errorBar').classList.add('on');$('errorBar').textContent=m}
function hideError(){$('errorBar').classList.remove('on')}
function togglePanel(id){const el=$(id),o=el.classList.contains('open');document.querySelectorAll('.ch-panel,.settings-drawer').forEach(x=>x.classList.remove('open'));if(!o)el.classList.add('open')}
function renderCh(){$('chList').innerHTML=chapters.map((c,i)=>`<div class="ch-item ${i===currentIdx?'active':''}" onclick="openCh(${i})"><span class="ch-num">${i+1}</span><span class="ch-dot ${translated[i]?'done':i===currentIdx?'busy':''}" id="dot${i}"></span><span class="ch-title">${c.title}</span>${translated[i]?'<span class="ch-ok">✓</span>':''}</div>`).join('')}

async function openCh(i){
  currentIdx=i;renderCh();hideError();$('chNav').classList.add('open');$('navTitle').textContent=chapters[i].title;
  $('prevBtn').disabled=i<=0;$('nextBtn').disabled=i>=chapters.length-1;
  document.querySelectorAll('.ch-panel,.settings-drawer').forEach(x=>x.classList.remove('open'));saveProgress();
  if(translated[i]){renderText(translated[i]);return}
  $('readerBody').innerHTML='<div class="reader-empty"><div class="spinner"></div><span>Đang dịch...</span></div>';
  showStatus('Đang dịch: '+chapters[i].title);
  const dot=$(`dot${i}`);if(dot)dot.className='ch-dot busy';
  try{
    const r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:chapters[i].url, novel_url:novelUrl, glossary:$('glossary').value, style:selectedStyle, custom_prompt:$('customPrompt').value})});
    const d=await r.json();hideStatus();
    if(!r.ok){showError(d.error||'Lỗi dịch');if(dot)dot.className='ch-dot';return}
    translated[i]=d.translation;if(dot)dot.className='ch-dot done';
    if(d.memory)updateMemBadge(d.memory);
    renderText(d.translation);renderCh();
  }catch(e){hideStatus();showError('Lỗi kết nối: '+e.message);if(dot)dot.className='ch-dot'}
}
function renderText(t){let h=t.split(/\n+/).filter(p=>p.trim()).map(p=>`<p>${p}</p>`).join('');if(currentIdx>=0&&currentIdx<chapters.length-1)h+=`<button class="next-btn" onclick="nav(1)">Chương tiếp theo →</button>`;$('readerBody').innerHTML=h;window.scrollTo({top:0,behavior:'smooth'})}
function nav(d){const n=currentIdx+d;if(n>=0&&n<chapters.length)openCh(n)}
function goLanding(){showScreen('landing');renderHistory()}
function goNovelInfo(){showScreen('novelInfo')}
function setFont(el){document.querySelectorAll('#fontPicker .s-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');document.documentElement.style.setProperty('--r-font',el.dataset.font);saveSettings()}
function setSize(v){document.documentElement.style.setProperty('--r-size',v+'px');$('sizeVal').textContent=v;saveSettings()}
function setLh(v){const l=(v/100).toFixed(2);document.documentElement.style.setProperty('--r-lh',l);$('lhVal').textContent=l;saveSettings()}
function setTheme(el){document.querySelectorAll('.s-color').forEach(c=>c.classList.remove('active'));el.classList.add('active');document.documentElement.style.setProperty('--r-bg',el.dataset.bg);document.documentElement.style.setProperty('--r-text',el.dataset.text);saveSettings()}
function clearCache(){translated={};renderCh()}
$('glossary')?.addEventListener('input',saveSettings);$('customPrompt')?.addEventListener('input',saveSettings);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowLeft')nav(-1);if(e.key==='ArrowRight')nav(1)});
loadSettings();renderHistory();
</script>
</body>
</html>
